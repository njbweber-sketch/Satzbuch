<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111A23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Satzbuch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Satzbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: eine schmale Spalte wie ein Trainingsbuch. Tab-Leiste unten, Pausenleiste darüber.
   Farben stammen von Hantelscheiben: Rot, Blau, Gelb, Grün, Weiß, Schwarz. */
:root{
  --bg:#E6EAEE; --surface:#F6F8FA; --ink:#111A23; --muted:#56636E; --line:#C7CFD6; --tint:#D9E0E6; --bar:#9AA8B4;
  --accent:#D2312B; --accent-ink:#FFFFFF; --ok:#1B8548;
  --p-red:#D2312B; --p-blue:#2556B8; --p-yellow:#E3B106; --p-green:#1E8D4D; --p-white:#FFFFFF; --p-black:#2B343C;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141B; --surface:#16202A; --ink:#E6ECF1; --muted:#8E9DAA; --line:#283642; --tint:#1F2D39; --bar:#3F5263;
    --accent:#F0524C; --accent-ink:#1A0A09; --ok:#3CC47B;
    --p-red:#F0524C; --p-blue:#5C8DFF; --p-yellow:#F0C21E; --p-green:#3CC47B; --p-white:#E8EEF3; --p-black:#586573;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#16202A; --ink:#E6ECF1; --muted:#8E9DAA; --line:#283642; --tint:#1F2D39; --bar:#3F5263;
  --accent:#F0524C; --accent-ink:#1A0A09; --ok:#3CC47B;
  --p-red:#F0524C; --p-blue:#5C8DFF; --p-yellow:#F0C21E; --p-green:#3CC47B; --p-white:#E8EEF3; --p-black:#586573;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--f-body);padding-inline:16px;padding-block:0 calc(var(--nav-h) + 120px + env(safe-area-inset-bottom,0px));min-height:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:640px;margin-inline:auto}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:10px;font:800 22px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase}
.plate{--c:var(--p-red);display:inline-block;flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink);background:radial-gradient(circle,var(--bg) 0 20%,var(--c) 22%)}
.brand .plate{width:22px;height:22px}
.sync{font:400 11px/1 var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
.sync[data-s="cloud"]::before{background:var(--ok);border-color:var(--ok)}

/* Typo */
.eyebrow{font:500 11px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h1{font:800 44px/.95 var(--f-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.h2{font:700 26px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.hint{font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:24px;padding-block:8px}
.sec{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

/* Buttons */
.btn{height:54px;padding-inline:22px;border:0;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:700 21px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;width:100%}
.btn:active{transform:translateY(1px)}
.ghost{height:42px;padding-inline:14px;border:1px solid var(--line);border-radius:6px;background:transparent;font:500 14px/1 var(--f-body)}
.ghost.sm{height:34px;padding-inline:10px;font-size:13px}
.ghost[aria-pressed="true"],.ghost.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ghost.warn{border-color:var(--accent);color:var(--accent)}
.ghost.warn.sure{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}

/* Karten nur dort, wo ein Objekt abgesetzt werden soll */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}

/* Wochenleiste */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font:500 11px/1 var(--f-mono);color:var(--muted)}
.wd i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:block}
.wd.did i{background:var(--accent);border-color:var(--accent)}
.wd.today{color:var(--ink)}
.wd.today i{border-color:var(--ink)}
.wd.did.today i{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}

/* Nächstes Training */
.next{display:flex;flex-direction:column;gap:14px}
.next .h1{font-size:76px}
.exl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.exl li{display:flex;align-items:center;gap:10px;font-size:15px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum b{display:block;font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.sum span{font:400 11px/1.3 var(--f-mono);color:var(--muted)}

/* Aktives Training */
.act-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.elapsed{font:500 20px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.ex{display:flex;flex-direction:column;gap:10px}
.ex-h{display:flex;gap:10px;align-items:flex-start}
.ex-h .plate{margin-top:3px;width:20px;height:20px}
.ex-t{flex:1;min-width:0}
.ex-t h3{font:700 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.sh,.sr{display:grid;grid-template-columns:2.4rem 1fr 1fr 3rem;gap:8px;align-items:center}
.sh{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.sets{display:flex;flex-direction:column;gap:8px}
.sn{font:700 20px/1 var(--f-display);text-align:center;color:var(--muted)}
.sr input{width:100%;min-width:0;height:46px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.sr input::-webkit-outer-spin-button,.sr input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.chk{width:100%;height:46px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--muted);display:grid;place-items:center;padding:0}
.chk svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.sr.done input{background:var(--tint);border-color:var(--tint)}
.sr.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.sr.done .sn{color:var(--ink)}
.pr{font:700 12px/1 var(--f-display);letter-spacing:.06em;background:var(--p-yellow);color:#1A1A1A;border-radius:4px;padding:5px 0;text-align:center}
.ex-f{display:flex;gap:8px;flex-wrap:wrap}

/* Pläne */
.plan{display:flex;flex-direction:column;gap:12px}
.day{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding-block:12px;border-top:1px solid var(--line)}
.day>div{min-width:0}
.day h3{font:700 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.pl-dots{display:flex;gap:4px;margin-bottom:6px}
.day p{font-size:13px;color:var(--muted)}

/* Verlauf */
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats>div{padding-inline:12px;border-left:1px solid var(--line)}
.stats>div:first-child{padding-left:0;border-left:0}
.stats b{display:block;font:800 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stats span{font:400 11px/1.3 var(--f-mono);color:var(--muted)}
.chart{width:100%;display:block;overflow:visible}
.chart .g{stroke:var(--line);stroke-width:1;fill:none}
.chart .ax{fill:var(--muted);font:400 10.5px var(--f-mono)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.1;stroke:none}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .dot.last{fill:var(--accent)}
.chart .bar{fill:var(--bar);stroke:none}
.chart .bar.cur{fill:var(--accent)}
.chart .val{fill:var(--ink);font:500 10.5px var(--f-mono)}
.sel{height:42px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding-inline:10px;max-width:100%}
.field{height:42px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding-inline:12px;font-variant-numeric:tabular-nums;min-width:0}
.rec,.hist{display:flex;flex-direction:column}
.rec>div{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.rec b{font:500 15px/1.2 var(--f-body)}
.rec .v{font:500 14px/1.2 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.rec small{display:block;color:var(--muted);font-size:12px}
.wk{border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:8px}
.wk-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;width:100%;background:none;border:0;padding:0;text-align:left}
.wk-h b{font:700 20px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;display:block}
.wk-h small{color:var(--muted);font-size:13px}
.wk-d{font-size:14px;display:flex;flex-direction:column;gap:6px}
.wk-d div{display:flex;gap:8px}
.wk-d b{flex:none;min-width:9.5em;font-weight:600}
.wk-d span{font-variant-numeric:tabular-nums;color:var(--muted)}

/* Scheibenrechner */
.bar-vis{display:flex;align-items:center;height:84px;padding-inline:4px}
.stub{flex:none;width:34px;height:8px;background:var(--bar);border-radius:2px 0 0 2px}
.collar{flex:none;width:10px;height:30px;background:var(--bar);border-radius:2px;margin-right:3px}
.disc{flex:none;border-radius:3px;border:1.5px solid var(--ink);margin-right:2px}
.tip{flex:1;height:8px;background:var(--bar);min-width:12px;max-width:60px;border-radius:0 2px 2px 0}

/* Leerzustand */
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* Fixiert */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;position:relative}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{stroke:var(--accent)}
#dot{position:absolute;top:10px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--accent)}
#rest{position:fixed;left:0;right:0;z-index:30;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg)}
.rin{max-width:640px;margin-inline:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.rin .l{font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.75}
#rt{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums;min-width:2.6em}
.rbtns{margin-left:auto;display:flex;gap:6px}
.rbtns button{height:36px;padding-inline:12px;border-radius:6px;border:1px solid currentColor;background:transparent;font:500 13px/1 var(--f-body);color:inherit}
.rprog{height:4px;background:rgba(127,127,127,.35)}
.rprog i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(1)}
#rest.fin #rt{color:var(--p-yellow)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 60px);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#sheet{position:fixed;inset:0;z-index:50}
.sheet-bg{position:absolute;inset:0;background:rgba(5,10,15,.55)}
.sheet-p{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-in{max-width:608px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;font-size:16px}
.pick:first-of-type{border-top:0}
.grp{padding-top:10px}
form.cus{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
/* Essen */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.daynav b{font:700 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.ghost:disabled{opacity:.35;cursor:default}
.kc{display:flex;flex-direction:column;gap:10px}
.kc-n{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kc-n b{font:800 64px/.9 var(--f-display);font-variant-numeric:tabular-nums}
.kc-n span{font:400 13px/1 var(--f-mono);color:var(--muted)}
.meter{height:10px;border-radius:5px;background:var(--tint);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:5px}
.meter i.over{background:var(--accent)}
.meter.sm{height:6px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.macros b{display:block;font:800 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.macros span{display:block;font:400 11px/1.3 var(--f-mono);color:var(--muted);margin-bottom:6px}
.fph{width:100%;max-height:220px;object-fit:cover;border-radius:6px;display:block}
.fi{display:grid;grid-template-columns:minmax(0,1fr) 4.4em 5.6em 2.4em;gap:6px;align-items:center}
.fi .field{width:100%}
.fi .v{font:500 14px/1 var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.meal{display:flex;flex-direction:column}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px}
.fe{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding-block:9px;border-top:1px solid var(--line)}
.fe b{font-weight:600;overflow-wrap:anywhere}
.fe small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.fe .v{font:500 15px/1 var(--f-mono);font-variant-numeric:tabular-nums}
details.card summary{cursor:pointer;font:700 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
details.card form{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.g2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.note{font-size:13px;line-height:1.45;color:var(--muted);border-left:3px solid var(--p-green);padding-left:10px}
/* Essen 2 */
.chart .gl{stroke:var(--ink);stroke-width:1;stroke-dasharray:4 4;fill:none;opacity:.55}
.ring{width:170px;height:170px;flex:none;display:block}
.rg-t{fill:none;stroke:var(--tint);stroke-width:16}
.rg-a{fill:none;stroke-width:16;stroke-linecap:butt}
.rg-n{font:800 40px var(--f-display);fill:var(--ink)}
.rg-n.over{fill:var(--accent)}
.rg-s{font:400 11px var(--f-mono);fill:var(--muted)}
.kcard{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.kside{flex:1;min-width:11em;display:flex;flex-direction:column;gap:14px}
.kside b{font:800 48px/1 var(--f-display);font-variant-numeric:tabular-nums;display:block}
.kside b small{font:400 13px var(--f-mono);color:var(--muted)}
.kside b.over{color:var(--accent)}
.leg{display:flex;flex-direction:column;gap:8px}
.leg>div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:14px}
.leg i{width:12px;height:12px;border-radius:50%;display:block}
.leg b{font:500 14px var(--f-mono);display:inline}
.tcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;width:100%}
.tc-n{font:500 15px/1.2 var(--f-body)}
.tc-n b{font:800 34px/1 var(--f-display);font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative;width:88px;height:88px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);padding:0;line-height:1;font-size:15px}
.fit{display:flex;flex-direction:column;gap:6px}
.fm{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.pk2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid var(--line)}
.pk2 .pick{border-top:0;min-width:0}
.pick span{display:block;min-width:0}
.pick b{display:block;font-weight:600;overflow-wrap:anywhere}
.pick small{display:block;color:var(--muted);font-size:12px}
.star{background:none;border:0;font-size:24px;color:var(--line);padding:0 8px;line-height:1}
.star[aria-pressed="true"]{color:var(--p-yellow)}
.lnk{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}
.lnk:disabled{cursor:default}
.mus{display:flex;flex-direction:column;gap:8px}
.mus>div{display:grid;grid-template-columns:8.5em 1fr 2em;gap:10px;align-items:center;font-size:14px}
.mb{height:12px;border-radius:6px;background:var(--tint);overflow:hidden}
.mb i{display:block;height:100%;border-radius:6px;border:1px solid var(--ink)}
.mus b{font:500 14px var(--f-mono);text-align:right}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.next .h1{font-size:60px}.stats b{font-size:32px}.wk-d b{min-width:7em}}
#scan{position:fixed;inset:0;z-index:70;background:#000;color:#fff;display:flex;flex-direction:column}
#scan[hidden]{display:none}
#scan .sc-top{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
#scan video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
#scan .sc-frame{position:absolute;left:10%;right:10%;top:32%;height:20%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.35);pointer-events:none}
#scan .sc-msg{position:absolute;left:16px;right:16px;top:58%;text-align:center;color:#fff;font-size:15px;text-shadow:0 1px 3px #000}

.lnk2{color:var(--p-blue);text-decoration:underline}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font:400 11px/1 var(--f-mono);color:var(--muted);text-align:center;padding-bottom:2px}

.cal-d.today{border-color:var(--ink);border-width:2px}

.cal-d .dots i{width:9px;height:9px;border-radius:50%;border:1px solid var(--line)}
.cal-d .dots i.cdot{background:transparent;border:2px solid var(--p-blue)}
.pe-ex{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.pe-ex>span{display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.pe-ex small{color:var(--muted);font-size:12px;text-align:right}
.lt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lt>div{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.lt small{display:block;color:var(--muted);font-size:12px}

async function flush(){

  try{await rdoc.set({json:JSON.stringify(S),t:S.t});setSync('cloud')}

async function initRemote(){
  try{
    if(!window.claude||!window.claude.use)return;
    var db=await window.claude.use('db'),user=await window.claude.use('user');
    if(!db||!user)return;
    var id=await user.id();
    if(!id)return;
    rcol=db.collection('data/users/'+id);rdoc=rcol.doc('state');
    rdoc.onSnapshot(function(snap){
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      var definitive=!(snap.metadata&&snap.metadata.fromCache);
      if(snap.exists){
        var d=snap.data()||{},r=null;
        try{r=JSON.parse(d.json)}catch(e){}
        if(r&&r.v===1){
          if(r.t>S.t){S=norm(r);try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}setSync('cloud');render()}
          else if(r.t<S.t&&first&&definitive){queueRemote()}
          else if(r.t===S.t){setSync('cloud')}
        }
        if(definitive)first=false;
      }else if(definitive){
        first=false;
        if(S.t>0)queueRemote();else setSync('cloud');

/* ---------- Gemini (kostenloser Schlüssel, nur auf diesem Gerät) ---------- */
var GK='satzbuch.gem',GDEF='gemini-3.5-flash';
function gemCfg(){try{var c=JSON.parse(localStorage.getItem(GK)||'{}');return {key:c.key||'',model:c.model||GDEF}}catch(e){return {key:'',model:GDEF}}}
function gemSet(c){try{localStorage.setItem(GK,JSON.stringify(c))}catch(e){}}
function gerr(code,msg){var e=new Error(msg||code);e.code=code;return e}
function toB64(file,max){return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    res(c.toDataURL('image/jpeg',0.82).split(',')[1]);
  };
  img.onerror=function(){URL.revokeObjectURL(url);rej(gerr('image_rejected'))};
  img.src=url;
})}
var GEM={json:async function(prompt,opts){
  opts=opts||{};var c=gemCfg();if(!c.key)throw gerr('no_key');
  var parts=[{text:prompt}],i;
  if(opts.images&&opts.images.length){for(i=0;i<opts.images.length;i++){parts.push({inline_data:{mime_type:'image/jpeg',data:await toB64(opts.images[i],1280)}})}}
  var r;
  try{
    r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(c.model)+':generateContent',{
      method:'POST',signal:opts.signal,headers:{'Content-Type':'application/json','x-goog-api-key':c.key},
      body:JSON.stringify({contents:[{role:'user',parts:parts}],generationConfig:{responseMimeType:'application/json',temperature:0.2}})
    });
  }catch(e){if(e&&e.name==='AbortError')throw gerr('cancelled');throw gerr('network')}
  if(!r.ok){
    var m='';try{m=(await r.json()).error.message||''}catch(e){}
    if(r.status===429)throw gerr('rate_limited',m);
    if(r.status===401||r.status===403||(r.status===400&&/api key/i.test(m)))throw gerr('bad_key',m);
    if(r.status===404)throw gerr('bad_model',m);
    throw gerr('http_'+r.status,m);
  }
  var j=await r.json(),t='';
  try{t=j.candidates[0].content.parts.map(function(p){return p.text||''}).join('')}catch(e){}
  if(!t)throw gerr(j.promptFeedback&&j.promptFeedback.blockReason?'refused':'empty_completion');
  t=t.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  try{return JSON.parse(t)}catch(e){throw gerr('invalid_json')}
}};

/* ---------- Barcode-Scanner + Open Food Facts ---------- */
var scn={stream:null,det:null,ZX:null,reader:null,hints:null,on:false,busy:false,code:''};
function zxLoad(){return new Promise(function(res,rej){
  if(window.ZXing)return res(window.ZXing);
  var urls=['https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js','https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'],i=0;
  (function next(){
    if(i>=urls.length)return rej(new Error('zx'));
    var s=document.createElement('script');s.src=urls[i++];
    s.onload=function(){window.ZXing?res(window.ZXing):next()};s.onerror=next;document.head.appendChild(s);
  })();
})}
function scanMsg(t){var m=$('#scm');if(m)m.textContent=t}
function scanHTML(){
  return '<div class="sc-top"><b style="font:800 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em">Barcode scannen</b><button class="ghost sm" data-a="scanx">Schließen</button></div>'+
    '<video id="scv" playsinline muted autoplay></video><div class="sc-frame"></div><p class="sc-msg" id="scm"></p>'+
    '<div class="sc-bot"><div class="row"><input class="field" id="sce" type="text" inputmode="numeric" maxlength="14" placeholder="Code eintippen" data-in="scode" aria-label="Barcode-Nummer" style="flex:1"><button class="ghost" data-a="scgo">Suchen</button></div>'+
    '<button class="ghost" data-a="scphoto">Foto vom Barcode aufnehmen</button></div>'+
    '<input type="file" id="scf" accept="image/*" capture="environment" hidden data-in="scfile">';
}
async function decodeCanvas(cv){
  if(scn.det){try{var r=await scn.det.detect(cv);if(r.length)return r[0].rawValue}catch(e){}return null}
  if(!scn.ZX||!scn.reader)return null;
  try{
    var ZX=scn.ZX,bmp=new ZX.BinaryBitmap(new ZX.HybridBinarizer(new ZX.HTMLCanvasElementLuminanceSource(cv)));
    return scn.reader.decode(bmp,scn.hints).getText();
  }catch(e){return null}
}
async function prepDecoder(){
  if(scn.det||scn.reader)return true;
  if('BarcodeDetector' in window){try{scn.det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});return true}catch(e){}}
  try{
    var ZX=await zxLoad();scn.ZX=ZX;
    var h=new Map();h.set(ZX.DecodeHintType.POSSIBLE_FORMATS,[ZX.BarcodeFormat.EAN_13,ZX.BarcodeFormat.EAN_8,ZX.BarcodeFormat.UPC_A,ZX.BarcodeFormat.UPC_E]);h.set(ZX.DecodeHintType.TRY_HARDER,true);
    scn.hints=h;scn.reader=new ZX.MultiFormatReader();scn.reader.setHints(h);return true;
  }catch(e){return false}
}
function stopScan(){
  scn.on=false;
  if(scn.stream){try{scn.stream.getTracks().forEach(function(t){t.stop()})}catch(e){}scn.stream=null}
}
function closeScan(){stopScan();var s=$('#scan');if(s)s.remove()}
async function startScan(){
  var v=$('#scv');
  try{
    scn.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
    v.srcObject=scn.stream;await v.play();
  }catch(e){scanMsg('Kamera nicht verfügbar. Tippe den Code unten ein oder nimm ein Foto vom Barcode auf.');return}
  scanMsg('Lade Scanner …');
  var ok=await prepDecoder();
  if(!ok){scanMsg('Scanner nicht geladen (Internet nötig). Tippe den Code unten ein.');return}
  scanMsg('Halte den Barcode ruhig in den Rahmen.');
  var cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  scn.on=true;
  (async function loop(){
    if(!scn.on)return;
    try{
      if(v.videoWidth>0){
        var w=Math.min(1280,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);
        cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);
        var code=await decodeCanvas(cv);
        if(code&&/^\d{8,14}$/.test(code)&&scn.on){onCode(code);return}
      }
    }catch(e){}
    setTimeout(loop,220);
  })();
}
function num(x){x=parseFloat(x);return isFinite(x)&&x>=0?x:0}
async function onCode(code){
  if(scn.busy)return;scn.busy=true;stopScan();scanMsg('Suche '+code+' …');
  try{
    var r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,product_name_de,brands,nutriments,serving_quantity');
    var j=await r.json(),p=j&&j.status===1?j.product:null;
    if(!p){closeScan();scn.busy=false;ui.fs={mode:'custom',q:'',sel:null,g:100};drawFS();toast('Code '+code+' ist nicht in Open Food Facts. Lege das Produkt selbst an.');return}
    var n=p.nutriments||{},kcal=num(n['energy-kcal_100g']);
    if(!kcal&&num(n['energy_100g']))kcal=num(n['energy_100g'])/4.184;
    var name=((p.product_name_de||p.product_name||'Produkt')+(p.brands?' ('+String(p.brands).split(',')[0].trim()+')':'')).slice(0,60);
    var f={n:name,k:Math.round(kcal*10)/10,p:num(n.proteins_100g),c:num(n.carbohydrates_100g),f:num(n.fat_100g),u:'',ug:0};
    var sq=num(p.serving_quantity);if(sq>0){f.u='Portion';f.ug=Math.round(sq)}
    closeScan();scn.busy=false;

var MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function mainGroup(w){var c={};w.e.forEach(function(e){var g=getEx(e.x).g;c[g]=(c[g]||0)+e.s.length});return Object.keys(c).sort(function(a,b){return c[b]-c[a]})[0]||'arme'}

function lastByGroup(){var m={};S.w.forEach(function(w){var t=+new Date(w.d);w.e.forEach(function(e){var g=getEx(e.x).g;if(!m[g]||m[g]<t)m[g]=t})});return m}
function calDetail(k){

function calSection(){

/* ---------- Helfer ---------- */
function getEx(id){return EX.find(function(e){return e.id===id})||S.cus.find(function(e){return e.id===id})||{id:id,n:id,g:'arme',bw:false}}
function plate(g){return '<span class="plate" style="--c:var('+(GROUPS[g]||GROUPS.arme).c+')"></span>'}
function allEx(){return EX.concat(S.cus)}
function bodyKg(){var b=S.bw;return b.length?b[b.length-1].kg:75}
function fmtS(x,a){var ex=getEx(x);return ex.t?(a[0]?nf(a[0])+' kg × ':'')+a[1]+' s':nf(a[0])+' × '+a[1]}
function score(x,kg,reps){var ex=getEx(x);if(ex.t)return 0;var k=(+kg||0)+(ex.bw?bodyKg():0),n=+reps||0;if(!k||!n)return 0;return n===1?k:k*(1+n/30)}
function dkey(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function weekKey(ts){var d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function pw(k,n){var d=new Date(k);d.setDate(d.getDate()-7*(n==null?1:n));return d.getTime()}
function fd(ts){return new Date(ts).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})}
function fds(ts){return new Date(ts).toLocaleDateString('de-DE',{day:'numeric',month:'numeric'})}
function hms(sec){sec=Math.max(0,Math.floor(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+pad(m):m)+':'+pad(s)}
function vol(w){return w.e.reduce(function(a,e){return a+e.s.reduce(function(b,s){return b+s[0]*s[1]},0)},0)}
function nsets(w){return w.e.reduce(function(a,e){return a+e.s.length},0)}
function lastSets(x){for(var i=S.w.length-1;i>=0;i--){var e=S.w[i].e.find(function(e){return e.x===x});if(e&&e.s.length)return e.s}return null}
function bests(){var m={};S.w.forEach(function(w){w.e.forEach(function(e){e.s.forEach(function(s){var sc=score(e.x,s[0],s[1]);if(sc>0&&(!m[e.x]||sc>m[e.x].sc))m[e.x]={sc:sc,kg:s[0],reps:s[1],t:+new Date(w.d)}})})});return m}
function series(x){var out=[];S.w.forEach(function(w){var e=w.e.find(function(e){return e.x===x});if(!e)return;var b=0,bs=null;e.s.forEach(function(s){var sc=score(x,s[0],s[1]);if(sc>b){b=sc;bs=s}});if(b>0)out.push({t:+new Date(w.d),y:b,s:bs})});return out}
function trained(){var c={};S.w.forEach(function(w){w.e.forEach(function(e){c[e.x]=(c[e.x]||0)+1})});return Object.keys(c).filter(function(x){return series(x).length>0}).sort(function(a,b){return c[b]-c[a]})}
function weekCounts(){var m=new Map();S.w.forEach(function(w){var k=weekKey(+new Date(w.d));m.set(k,(m.get(k)||0)+1)});(S.cd||[]).forEach(function(c){if(c.m>=20){var k=weekKey(+dateOf(c.d));m.set(k,(m.get(k)||0)+1)}});return m}
function streak(){var m=weekCounts(),k=weekKey(Date.now());if(!m.has(k))k=pw(k);var n=0;while(m.has(k)){n++;k=pw(k)}return n}
function nextDay(){var plan=allPlans().find(function(p){return p.id===S.set.plan})||PLANS[0],di=0;for(var k=S.w.length-1;k>=0;k--){if(S.w[k].p===plan.id&&S.w[k].di!=null){di=(S.w[k].di+1)%plan.days.length;break}}return {plan:plan,di:di}}
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2800)}
function conf(key,fn){clearTimeout(ct);if(ui.conf===key){ui.conf=null;fn()}else{ui.conf=key;ct=setTimeout(function(){ui.conf=null;render()},3000);render()}}

function beep(){if(!ac)return;[0,.22,.44].forEach(function(d,k){var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+d;o.frequency.value=k===2?1175:880;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.2)})}
function startRest(){rest={end:Date.now()+S.set.rest*1000,total:S.set.rest*1000,fin:0};tick()}
function tick(){
  var now=Date.now(),el=$('#elapsed');
  if(el&&S.act)el.textContent=hms((now-S.act.t0)/1000);
  var bar=$('#rest');
  if(!rest){bar.hidden=true;return}
  bar.hidden=false;
  var left=(rest.end-now)/1000;
  if(left<=0){
    if(!rest.fin){rest.fin=now;beep();try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
    if(now-rest.fin>4000){rest=null;bar.hidden=true;bar.classList.remove('fin');return}
    bar.classList.add('fin');$('#rl').textContent='Weiter geht es';$('#rt').textContent='0:00';$('#rp').style.transform='scaleX(0)';return;
  }
  bar.classList.remove('fin');$('#rl').textContent='Pause';$('#rt').textContent=hms(Math.ceil(left));$('#rp').style.transform='scaleX('+Math.min(1,left*1000/rest.total)+')';
}
setInterval(tick,500);

/* ---------- Diagramme ---------- */
function cw(){return Math.max(280,Math.min(640,($('#view').clientWidth||340)))}
function ticks(lo,hi,n){if(hi<=lo)hi=lo+1;var raw=(hi-lo)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag,step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag,a=Math.floor(lo/step+1e-9)*step,b=Math.ceil(hi/step-1e-9)*step,t=[];for(var v=a;v<=b+step/2;v+=step)t.push(+v.toFixed(6));return t}
function lineChart(pts,unit){
  var W=cw(),H=190,l=40,r=16,t=22,b=28;
  var ys=pts.map(function(p){return p.y}),tk=ticks(Math.min.apply(null,ys),Math.max.apply(null,ys),4),y0=tk[0],y1=tk[tk.length-1];
  var xs=pts.map(function(p){return p.t}),x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),single=x1===x0;
  var px=function(x){return single?(l+(W-l-r)/2):l+(x-x0)/(x1-x0)*(W-l-r)},py=function(y){return t+(1-(y-y0)/(y1-y0))*(H-t-b)};
  var g='',i;
  tk.forEach(function(v){g+='<path class="g" d="M'+l+' '+py(v).toFixed(1)+'H'+(W-r)+'"/><text class="ax" x="'+(l-6)+'" y="'+(py(v)+3.5).toFixed(1)+'" text-anchor="end">'+nf(v,1)+'</text>'});
  var d=pts.map(function(p,k){return (k?'L':'M')+px(p.t).toFixed(1)+' '+py(p.y).toFixed(1)}).join('');
  var area=pts.length>1?'<path class="area" d="'+d+'L'+px(x1).toFixed(1)+' '+py(y0).toFixed(1)+'L'+px(x0).toFixed(1)+' '+py(y0).toFixed(1)+'Z"/>':'';
  var dots=pts.map(function(p,k){return '<circle class="dot'+(k===pts.length-1?' last':'')+'" cx="'+px(p.t).toFixed(1)+'" cy="'+py(p.y).toFixed(1)+'" r="'+(k===pts.length-1?4.5:3.2)+'"/>'}).join('');
  var lp=pts[pts.length-1],lx=px(lp.t),ly=Math.max(12,py(lp.y)-10);
  var anchor=lx>W-50?'end':(lx<l+30?'start':'middle');
  var lab='<text class="val" x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anchor+'">'+nf(lp.y,1)+' '+unit+'</text>';
  var xl=single?'<text class="ax" x="'+px(x0).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+fds(x0)+'</text>':'<text class="ax" x="'+l+'" y="'+(H-8)+'" text-anchor="start">'+fds(x0)+'</text><text class="ax" x="'+(W-r)+'" y="'+(H-8)+'" text-anchor="end">'+fds(x1)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Verlauf">'+g+area+'<path class="ln" d="'+d+'"/>'+dots+lab+xl+'</svg>';
}
function barChart(bars,fmt,goal){
  var W=cw(),H=190,l=36,r=8,t=20,b=28,n=bars.length;
  var mx=Math.max(goal||0,Math.max.apply(null,bars.map(function(x){return x.v}))),tk=ticks(0,mx||1,4),y1=tk[tk.length-1];
  var py=function(v){return t+(1-v/y1)*(H-t-b)},slot=(W-l-r)/n,bw=Math.min(34,slot*.62);
  var g=tk.map(function(v){return '<path class="g" d="M'+l+' '+py(v).toFixed(1)+'H'+(W-r)+'"/><text class="ax" x="'+(l-6)+'" y="'+(py(v)+3.5).toFixed(1)+'" text-anchor="end">'+fmt(v)+'</text>'}).join('');
  var bs=bars.map(function(x,k){
    var cx=l+slot*k+slot/2,h=(H-b)-py(x.v),cur=k===n-1;
    return (x.v>0?'<rect class="bar'+(cur?' cur':'')+'" x="'+(cx-bw/2).toFixed(1)+'" y="'+py(x.v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,1).toFixed(1)+'" rx="2"/><text class="val" x="'+cx.toFixed(1)+'" y="'+(py(x.v)-5).toFixed(1)+'" text-anchor="middle">'+fmt(x.v)+'</text>':'')+
      '<text class="ax" x="'+cx.toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle">'+x.l+'</text>';
  }).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Balkendiagramm">'+g+(goal?'<path class="gl" d="M'+l+' '+py(goal).toFixed(1)+'H'+(W-r)+'"/>':'')+bs+'</svg>';
}

  var got=t-2*rem,cnt={};out.forEach(function(p){cnt[p]=(cnt[p]||0)+1});

  var txt=out.length?Object.keys(cnt).sort(function(a,b){return b-a}).map(function(p){return cnt[p]+' × '+nf(p,2)+' kg'}).join(' · '):'Nur die Stange';
  return '<div class="bar-vis" aria-hidden="true"><span class="stub"></span><span class="collar"></span>'+discs+'<span class="tip"></span></div><p><b>Pro Seite:</b> '+txt+'</p>'+(rem>1e-6?'<p class="hint">Mit den vorhandenen Scheiben erreichst du '+nf(got,2)+' kg.</p>':'<p class="hint num">Gesamt '+nf(got,2)+' kg inklusive Stange.</p>');

function todayK(){return dkey(Date.now())}
function dateOf(k){var p=k.split('-');return new Date(+p[0],p[1]-1,+p[2])}
function shiftK(k,n){var d=dateOf(k);d.setDate(d.getDate()+n);return dkey(d.getTime())}
function ymOf(k){return k.slice(0,7)}

function mealNow(){var h=new Date().getHours();return h<10?MEALS[0]:h<15?MEALS[1]:h<17?MEALS[3]:MEALS[2]}
function fm(k){
  var m=ymOf(k);
  if(!F[m]){var r=null;try{r=JSON.parse(localStorage.getItem(FK+m))}catch(e){}F[m]=(r&&r.m)?r:{t:0,m:[]}}
  pullMonth(m);return F[m];
}
function pullMonth(m){
  if(!rcol||fpulled[m])return;fpulled[m]=1;
  rcol.doc('f_'+m).get().then(function(snap){
    var cur=F[m]||{t:0,m:[]};
    if(!snap.exists){if(cur.t>0)queueFood(m);return}
    var r=null;try{r=JSON.parse((snap.data()||{}).json)}catch(e){}
    if(!r||!r.m)return;
    if(r.t>cur.t){F[m]=r;try{localStorage.setItem(FK+m,JSON.stringify(r))}catch(e){}if(ui.tab==='essen'||ui.tab==='heute')render()}
    else if(r.t<cur.t)queueFood(m);
  }).catch(function(){});
}
function saveFood(m){F[m].t=Date.now();try{localStorage.setItem(FK+m,JSON.stringify(F[m]))}catch(e){}queueFood(m)}
function queueFood(m){if(!rcol)return;clearTimeout(fT[m]);fT[m]=setTimeout(function(){flushFood(m)},1200)}

/* Suche */
function fold(s){return String(s).toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss')}
function allFoods(){return S.cf.concat(FOODS)}
function findFood(n){var f=fold(n);return allFoods().find(function(x){return fold(x.n)===f})||null}
function matchFood(name,dbName){
  var hit=dbName&&findFood(dbName);if(hit)return hit;
  var toks=fold(name).split(/[^a-z0-9]+/).filter(function(t){return t.length>=3});if(!toks.length)return null;
  var best=null,bs=0;
  allFoods().forEach(function(x){var fx=fold(x.n),ws=fx.split(/[^a-z0-9]+/).filter(function(w){return w.length>=4}),h=0;toks.forEach(function(t){if(fx.indexOf(t)>=0||ws.some(function(w){return t.indexOf(w)===0}))h++});var r=h/toks.length,s=r-fx.length/1000;if(r>=.5&&s>bs){bs=s;best=x}});
  return best;
}
function searchFoods(q){
  var toks=fold(q).split(/\s+/).filter(Boolean);if(!toks.length)return [];
  var res=[];allFoods().forEach(function(x){var fx=fold(x.n);if(toks.every(function(t){return fx.indexOf(t)>=0}))res.push({x:x,r:fx.indexOf(toks[0])===0?0:1})});
  res.sort(function(a,b){return a.r-b.r||a.x.n.length-b.x.n.length});
  return res.slice(0,30).map(function(o){return o.x});
}
function isFav(n){return S.fv.indexOf(n)>=0}
function recents(){
  var k=todayK(),ms={};ms[ymOf(k)]=k;ms[ymOf(shiftK(k,-31))]=shiftK(k,-31);
  var all=[];Object.keys(ms).forEach(function(m){all=all.concat(fm(ms[m]).m)});
  all.sort(function(a,b){return b.ts-a.ts});
  var seen={},out=[];
  for(var i=0;i<all.length&&out.length<8;i++){var e=all[i];if(seen[e.n])continue;seen[e.n]=1;out.push(e)}
  return out;
}

/* Ring */
function ring(T,goal){
  var R=68,C=2*Math.PI*R,pk=T.p*4,ck=T.c*4,fk=T.f*9,den=Math.max(goal,pk+ck+fk,1),off=0,arcs='';
  [[pk,'--p-blue'],[ck,'--p-yellow'],[fk,'--p-red']].forEach(function(a){
    var len=a[0]/den*C;if(len<=.5)return;
    arcs+='<circle class="rg-a" cx="85" cy="85" r="'+R+'" style="stroke:var('+a[1]+')" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';off+=len;
  });
  var over=T.k>goal;
  return '<svg class="ring" viewBox="0 0 170 170" role="img" aria-label="Kalorien heute"><circle class="rg-t" cx="85" cy="85" r="'+R+'"/><g transform="rotate(-90 85 85)">'+arcs+'</g><text class="rg-n'+(over?' over':'')+'" x="85" y="90" text-anchor="middle">'+nf(T.k,0)+'</text><text class="rg-s" x="85" y="110" text-anchor="middle">von '+nf(goal,0)+' kcal</text></svg>';
}

/* Foto-Schätzung */
function itF(it,key){
  if(it.use&&it.m){var mp={k0:'k',p0:'p',c0:'c',f0:'f'};return it.m[mp[key]]*it.g/100}
  var f=it.g0>0?it.g/it.g0:1;return it[key]*f;
}
function frTot(items){return items.reduce(function(a,it){a.k+=itF(it,'k0');a.p+=itF(it,'p0');a.c+=itF(it,'c0');a.f+=itF(it,'f0');return a},{k:0,p:0,c:0,f:0})}
function frTotTxt(t){return nf(t.k,0)+' kcal · Eiweiß '+nf(t.p,0)+' g · KH '+nf(t.c,0)+' g · Fett '+nf(t.f,0)+' g'}
function smpErr(e){
  var c=e&&e.code;
  if(c==='no_key')return 'Es ist noch kein Gemini-Schlüssel hinterlegt. Unter Mehr → Foto-Schätzung einrichten.';
  if(c==='bad_key')return 'Gemini hat den Schlüssel abgelehnt. Prüfe ihn unter Mehr → Foto-Schätzung.';
  if(c==='bad_model')return 'Das Gemini-Modell gibt es nicht (mehr). Trage unter Mehr → Foto-Schätzung ein anderes ein.';
  if(c==='network')return 'Keine Verbindung zu Gemini. Prüfe dein Internet.';
  if(c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'||c==='images_unavailable')return 'Die Schätzung ist für dieses Konto oder in dieser Ansicht nicht verfügbar. Die Lebensmittel-Datenbank funktioniert weiterhin.';
  if(c==='rate_limited')return 'Das kostenlose Limit von Gemini ist gerade erreicht. Warte eine Minute oder bis morgen und versuche es noch einmal.';
  if(c==='image_rejected')return 'Ein Bild konnte nicht gelesen werden. Nimm das Foto im JPEG- oder PNG-Format auf.';
  
  if(c==='refused')return 'Dazu gibt Gemini keine Schätzung ab. Beschreibe die Mahlzeit in Worten.';
  if(c==='invalid_json'||c==='empty_completion')return 'Die Antwort war nicht lesbar. Versuche es noch einmal, am besten mit einer kurzen Beschreibung.';
  return 'Die Schätzung hat nicht geklappt. Versuche es noch einmal.';
}

function foodRow(x){
  return '<div class="pk2"><button class="pick" data-a="fsel" data-n="'+esc(x.n)+'"><span><b>'+esc(x.n)+'</b><small>'+nf(x.k,0)+' kcal · E '+nf(x.p,1)+' · KH '+nf(x.c,1)+' · F '+nf(x.f,1)+' pro 100 g</small></span></button><button class="star" data-a="fav" data-n="'+esc(x.n)+'" aria-pressed="'+isFav(x.n)+'" aria-label="Favorit">★</button></div>';
}
function fsList(q){
  var h='';
  if(q.trim()){
    var r=searchFoods(q);
    h=r.length?r.map(foodRow).join(''):'<p class="hint">Nichts gefunden. Lege das Lebensmittel unten selbst an.</p>';
  }else{
    var fv=S.fv.map(findFood).filter(Boolean);
    if(fv.length)h+='<p class="eyebrow grp">Favoriten</p>'+fv.map(foodRow).join('');
    ui.rc=recents();
    if(ui.rc.length)h+='<p class="eyebrow grp">Zuletzt gegessen</p>'+ui.rc.map(function(e,i){return '<div class="pk2"><div class="pick"><span><b>'+esc(e.n)+'</b><small>'+(e.g?nf(e.g,0)+' g · ':'')+nf(e.k,0)+' kcal</small></span></div><button class="ghost sm" data-a="fqa" data-i="'+i+'">+ Nochmal</button></div>'}).join('');
    if(S.mm.length)h+='<p class="eyebrow grp">Meine Gerichte</p>'+S.mm.map(function(m){var t=tot(m.items);return '<div class="pk2"><div class="pick"><span><b>'+esc(m.n)+'</b><small>'+nf(t.k,0)+' kcal · '+m.items.length+' Zutaten</small></span></div><span class="row" style="gap:6px;flex-wrap:nowrap"><button class="ghost sm" data-a="fmadd" data-id="'+m.id+'">+ Hinzufügen</button><button class="ghost sm warn'+(ui.conf==='mm'+m.id?' sure':'')+'" data-a="fmdel" data-id="'+m.id+'" aria-label="Gericht löschen">'+(ui.conf==='mm'+m.id?'Sicher?':'×')+'</button></span></div>'}).join('');
    if(!h)h='<p class="hint">Tippe einen Namen ein, zum Beispiel Haferflocken, Skyr oder Reis. Die Datenbank enthält rund '+FOODS.length+' Lebensmittel mit Richtwerten.</p>';
  }
  return h+'<button class="ghost" data-a="fscust" style="margin-top:12px;width:100%">Eigenes Lebensmittel anlegen</button>';
}
function fsRes(){
  var g=+ui.fs.g||0,f=ui.fs.sel;
  return '<b>'+nf(f.k*g/100,0)+' kcal</b> · Eiweiß '+nf(f.p*g/100,1)+' g · KH '+nf(f.c*g/100,1)+' g · Fett '+nf(f.f*g/100,1)+' g';
}
function fsAmount(){
  var s=ui.fs,f=s.sel,ed=!!s.eid,chips='';
  if(f.ug)chips+='<button class="ghost sm" data-a="fsset" data-v="'+f.ug+'">1 × '+esc(f.u)+' ('+f.ug+' g)</button><button class="ghost sm" data-a="fsset" data-v="'+(f.ug*2)+'">2 × '+esc(f.u)+'</button>';
  [50,100,150,200,250].forEach(function(g){chips+='<button class="ghost sm" data-a="fsset" data-v="'+g+'">'+g+' g</button>'});
  return '<div class="sec"><div><h3 class="h2" style="font-size:24px;overflow-wrap:anywhere">'+esc(f.n)+'</h3><p class="hint num">Pro 100 g: '+nf(f.k,0)+' kcal · E '+nf(f.p,1)+' · KH '+nf(f.c,1)+' · F '+nf(f.f,1)+'</p></div>'+
    '<div class="row"><input class="field" id="fsg" type="number" inputmode="decimal" min="1" max="3000" step="5" value="'+s.g+'" data-in="fsg" style="width:7em" aria-label="Menge in Gramm"><span class="hint">Gramm</span></div><div class="chips">'+chips+'</div>'+
    '<p class="num" id="fsres">'+fsRes()+'</p>'+
    (ed?'':'<select class="sel" id="fsml" data-in="fsml" aria-label="Mahlzeit">'+MEALS.map(function(m){return '<option'+(m===s.ml?' selected':'')+'>'+m+'</option>'}).join('')+'</select>')+
    '<div class="row"><button class="btn" data-a="fsadd" style="flex:1">'+(ed?'Speichern':'Hinzufügen')+'</button>'+(ed?'':'<button class="ghost" data-a="fsback">Zurück</button>')+'</div></div>';
}
function fsCustom(){
  return '<form class="cus" data-form="cf" style="border-top:0;padding-top:0"><p class="hint">Nährwerte pro 100 g, wie auf der Verpackung.</p><input class="field" id="cfn" type="text" maxlength="60" placeholder="Name" aria-label="Name">'+
    '<div class="g2"><input class="field" id="cfk" type="number" inputmode="decimal" min="0" placeholder="kcal" aria-label="Kalorien pro 100 g"><input class="field" id="cfp" type="number" inputmode="decimal" min="0" placeholder="Eiweiß g" aria-label="Eiweiß pro 100 g"><input class="field" id="cfc" type="number" inputmode="decimal" min="0" placeholder="KH g" aria-label="Kohlenhydrate pro 100 g"></div>'+
    '<div class="g2"><input class="field" id="cff" type="number" inputmode="decimal" min="0" placeholder="Fett g" aria-label="Fett pro 100 g"><input class="field" id="cfu" type="text" maxlength="14" placeholder="Portion, z. B. Stück" aria-label="Name der Portion"><input class="field" id="cfg" type="number" inputmode="decimal" min="0" placeholder="Portion g" aria-label="Gramm pro Portion"></div>'+
    '<div class="row"><button class="btn" type="submit" style="flex:1">Speichern</button><button class="ghost" type="button" data-a="fsback">Zurück</button></div></form>';
}
function fsSaveMeal(){
  var s=ui.fs,t=tot(s.items);
  return '<form class="cus" data-form="smeal" style="border-top:0;padding-top:0"><p class="hint num">'+s.items.length+' Zutaten, zusammen '+nf(t.k,0)+' kcal. Das Gericht lässt sich später mit einem Tipp wieder eintragen.</p><input class="field" id="smn" type="text" maxlength="40" placeholder="Name, z. B. Standard-Frühstück" value="'+esc(s.name||'')+'" aria-label="Name des Gerichts"><div class="row"><button class="btn" type="submit" style="flex:1">Gericht speichern</button><button class="ghost" type="button" data-a="fsclose">Abbrechen</button></div></form>';
}
function drawFS(){
  var m=$('#sheet'),s=ui.fs,title,body;
  m.hidden=false;
  if(s.mode==='amount'){title=s.eid?'Menge ändern':'Menge';body=fsAmount()}
  else if(s.mode==='custom'){title='Eigenes Lebensmittel';body=fsCustom()}
  else if(s.mode==='savemeal'){title='Gericht speichern';body=fsSaveMeal()}
  else{title='Lebensmittel';body='<input class="field" id="fq" type="search" placeholder="Suchen, z. B. Skyr" autocomplete="off" value="'+esc(s.q)+'" data-in="fq" aria-label="Lebensmittel suchen"><div id="fl">'+fsList(s.q)+'</div>'}
  m.innerHTML='<div class="sheet-bg" data-a="fsclose"></div><div class="sheet-p" role="dialog" aria-label="'+title+'"><div class="sheet-in"><div class="row between"><h2 class="h2">'+title+'</h2><button class="ghost sm" data-a="fsclose">Schließen</button></div>'+body+'</div></div>';
}
function openFS(){ui.fs={mode:'list',q:'',sel:null,g:100,ml:mealNow()};drawFS()}
function closeFS(){$('#sheet').hidden=true;$('#sheet').innerHTML='';ui.fs=null}
function selFood(f,ml){ui.fs={mode:'amount',q:'',sel:f,g:f.ug||100,ml:ml||mealNow()};drawFS()}

/* Ansichten */
function feRow(e){
  var sure=ui.conf==='fe'+e.id;
  return '<div class="fe"><div><button class="lnk" data-a="fedit" data-id="'+e.id+'"'+(e.g>0?'':' disabled')+'><b>'+esc(e.n)+'</b></button><small>'+(e.g?nf(e.g,0)+' g · ':'')+'E '+nf(e.p,0)+' · KH '+nf(e.c,0)+' · F '+nf(e.f,0)+(e.src==='foto'?' · geschätzt':'')+'</small></div><span class="v">'+nf(e.k,0)+'</span><button class="ghost sm warn'+(sure?' sure':'')+'" data-a="fdele" data-id="'+e.id+'" aria-label="Eintrag löschen">'+(sure?'Sicher?':'×')+'</button></div>';
}

  var h='<div class="stack"><div class="sec"><h1 class="h1">Essen</h1><div class="daynav"><button class="ghost sm" data-a="fday" data-v="-1" aria-label="Vorheriger Tag">‹</button><b>'+esc(lbl)+'</b><button class="ghost sm" data-a="fday" data-v="1" aria-label="Nächster Tag"'+(k>=todayK()?' disabled':'')+'>›</button></div></div>';
  h+='<section class="kcard">'+ring(T,goal)+'<div class="kside"><div><p class="eyebrow">'+(left>=0?'Noch übrig':'Über dem Ziel')+'</p><b class="num'+(left<0?' over':'')+'">'+nf(Math.abs(left),0)+'<small> kcal</small></b></div>'+
    '<div class="leg"><div><i style="background:var(--p-blue)"></i><span>Eiweiß</span><b class="num">'+nf(T.p,0)+' / '+nf(pg,0)+' g</b></div><div><i style="background:var(--p-yellow)"></i><span>Kohlenhydrate</span><b class="num">'+nf(T.c,0)+' g</b></div><div><i style="background:var(--p-red)"></i><span>Fett</span><b class="num">'+nf(T.f,0)+' g</b></div></div></div></section>';
  h+=cdFoodHint();
  h+='<div class="row"><button class="btn" data-a="fsopen" style="flex:1">Lebensmittel hinzufügen</button><button class="ghost" data-a="scan">Barcode scannen</button></div>';
  h+='<section class="card sec"><h2 class="h2">Foto-Schätzung</h2>';
  if(SMP){
    var q=ui.fq||[];
    if(q.length)h+=thumbs(q.map(function(x){return x.url}),true);
    h+='<input class="field" id="fhint" type="text" maxlength="200" placeholder="Optional: Beschreibung oder Menge" data-in="fhint" value="'+esc(ui.fhint||'')+'" aria-label="Beschreibung der Mahlzeit"><div class="row">'+(SMPIMG&&q.length<SMPMAX?'<button class="ghost" data-a="shoot">Foto aufnehmen</button><button class="ghost" data-a="gallery">Aus Galerie</button>':'')+'</div>'+
      '<button class="ghost" data-a="fgo" style="width:100%">'+(q.length?'Schätzen ('+q.length+(q.length===1?' Foto':' Fotos')+')':'Aus Text schätzen')+'</button>'+
      '<p class="hint">Bis zu '+SMPMAX+' Fotos aus verschiedenen Winkeln. Fotos gehen zur Schätzung an Google Gemini und werden in der App nicht gespeichert.</p>'+smpHint();
  }
  h+='</section>'+frCard();
  h+='<section class="card sec"><div class="row between"><h2 class="h2">Wasser</h2><span class="num hint">'+nf(wd/1000,2)+' von '+nf(wg/1000,1)+' l</span></div><div class="meter"><i style="width:'+Math.min(100,wg?wd/wg*100:0).toFixed(1)+'%;background:var(--p-blue)"></i></div><div class="row"><button class="ghost" data-a="water" data-v="250">+ 250 ml</button><button class="ghost" data-a="water" data-v="500">+ 500 ml</button><button class="ghost" data-a="water" data-v="-250">− 250 ml</button></div></section>';
  if(es.length){
    h+='<section class="sec"><h2 class="h2">Tagebuch</h2>';

    });
    h+='</section>';
  }else h+='<p class="hint">Für diesen Tag ist noch nichts eingetragen.</p>';
  h+='<details class="card"><summary>Manuell eintragen</summary><form data-form="food"><input class="field" id="mfn" type="text" maxlength="60" placeholder="Name, z. B. Restaurantgericht" aria-label="Name"><div class="g2"><input class="field" id="mfk" type="number" inputmode="decimal" min="0" placeholder="kcal" aria-label="Kalorien"><input class="field" id="mfp" type="number" inputmode="decimal" min="0" placeholder="Eiweiß g" aria-label="Eiweiß in Gramm"><input class="field" id="mfc" type="number" inputmode="decimal" min="0" placeholder="KH g" aria-label="Kohlenhydrate in Gramm"></div><div class="g2"><input class="field" id="mff" type="number" inputmode="decimal" min="0" placeholder="Fett g" aria-label="Fett in Gramm"><select class="sel" id="mfm" aria-label="Mahlzeit" style="grid-column:span 2">'+MEALS.map(function(m){return '<option'+(m===mealNow()?' selected':'')+'>'+m+'</option>'}).join('')+'</select></div><button class="ghost" type="submit">Eintragen</button></form></details>';

  if(S.set.plan==='reha'||S.rh.length){
    var last=S.rh[S.rh.length-1],done=last&&last.d===k;

  }

function muscleSection(){
  var cut=Date.now()-7*864e5,c={};
  S.w.forEach(function(w){if(+new Date(w.d)<cut)return;w.e.forEach(function(e){var g=getEx(e.x).g;c[g]=(c[g]||0)+e.s.length})});
  var keys=Object.keys(GROUPS);if(!keys.some(function(g){return c[g]}))return '';
  return '<section class="sec"><h2 class="h2">Sätze pro Muskelgruppe</h2><div class="mus">'+keys.map(function(g){var n=c[g]||0;return '<div><span>'+GROUPS[g].n+'</span><div class="mb"><i style="width:'+Math.min(100,n/20*100)+'%;background:var('+GROUPS[g].c+')"></i></div><b class="num">'+n+'</b></div>'}).join('')+'</div><p class="hint">Letzte 7 Tage. Als grober Richtwert gelten 10 bis 20 Sätze pro Muskelgruppe und Woche.</p></section>';
}
function kneeSection(){
  var rh=S.rh,td=todayK(),cur=rh.find(function(e){return e.d===td})||{},h='<section class="sec"><h2 class="h2">Knie-Verlauf</h2>';
  if(rh.length){
    h+=lineChart(rh.map(function(e){return {t:dateOf(e.d).getTime(),y:e.pain}}),'/10');
    h+='<p class="hint">Schmerz von 0 bis 10 im Verlauf.</p>';
    var fl=rh.filter(function(e){return e.fl>0});
    if(fl.length)h+=lineChart(fl.map(function(e){return {t:dateOf(e.d).getTime(),y:e.fl}}),'°')+'<p class="hint">Beugung in Grad. Messe immer gleich, am besten mit der Winkel-Funktion eines Handy-Lineals oder vom Physio.</p>';
  }
  h+='<details class="card"'+(ui.kopen?' open':'')+'><summary>Heute eintragen</summary><form data-form="knee"><label class="hint" for="kp">Schmerz: <output id="kpo">'+(cur.pain||0)+'</output> von 10</label><input id="kp" type="range" min="0" max="10" step="1" value="'+(cur.pain||0)+'" data-in="kp" style="width:100%;accent-color:var(--accent)"><select class="sel" id="ks" aria-label="Schwellung">'+['keine','leicht','deutlich'].map(function(o){return '<option value="'+o+'"'+(cur.sw===o?' selected':'')+'>Schwellung: '+o+'</option>'}).join('')+'</select>'+
    '<div class="g2" style="grid-template-columns:repeat(2,minmax(0,1fr))"><input class="field" id="kf" type="number" inputmode="numeric" min="0" max="170" placeholder="Beugung °" value="'+(cur.fl||'')+'" aria-label="Beugung in Grad"><input class="field" id="ke" type="number" inputmode="numeric" min="0" max="40" placeholder="Streckdefizit °" value="'+(cur.ex||'')+'" aria-label="Streckdefizit in Grad"></div><input class="field" id="kn" type="text" maxlength="120" placeholder="Notiz, z. B. nach Treppen steifer" value="'+esc(cur.n||'')+'" aria-label="Notiz"><button class="ghost" type="submit">Speichern</button></form></details></section>';
  return h;
}
function pfCalc(){
  var p=S.pf,w=+p.w||(S.bw.length?S.bw[S.bw.length-1].kg:0);
  if(!(w>0&&p.h>0&&p.age>0))return null;
  var bmr=10*w+6.25*p.h-5*p.age+(p.sex==='m'?5:-161),tdee=bmr*p.act,goal=Math.round((tdee+p.g)/50)*50;
  return {bmr:bmr,tdee:tdee,goal:goal,prot:Math.round(w*2/5)*5,w:w};
}
function pfRes(){
  var r=pfCalc();if(!r)return '<p class="hint">Trage Alter, Größe und Gewicht ein, dann erscheint die Rechnung.</p>';
  return '<p class="num">Grundumsatz <b>'+nf(r.bmr,0)+' kcal</b> · Gesamtumsatz <b>'+nf(r.tdee,0)+' kcal</b></p><p class="num">Vorschlag: <b>'+nf(r.goal,0)+' kcal</b> und <b>'+nf(r.prot,0)+' g</b> Eiweiß (2 g pro kg bei '+nf(r.w,1)+' kg)</p><button class="ghost" data-a="pfapply">Als Ziele übernehmen</button><p class="hint">Richtwerte nach Mifflin-St.-Jeor. Beobachte dein Gewicht zwei bis drei Wochen und passe das Ziel an.</p>';
}
function pfSection(){
  var p=S.pf;
  return '<section class="card sec"><h2 class="h2">Ziele berechnen</h2><div class="g2" style="grid-template-columns:repeat(2,minmax(0,1fr))"><select class="sel" id="pfs" data-in="pfsex" aria-label="Geschlecht"><option value="m"'+(p.sex==='m'?' selected':'')+'>Männlich</option><option value="f"'+(p.sex==='f'?' selected':'')+'>Weiblich</option></select><input class="field" id="pfa" type="number" inputmode="numeric" min="14" max="99" placeholder="Alter" value="'+(p.age||'')+'" data-in="pfage" aria-label="Alter"><input class="field" id="pfh" type="number" inputmode="numeric" min="120" max="230" placeholder="Größe cm" value="'+(p.h||'')+'" data-in="pfh" aria-label="Größe in Zentimetern"><input class="field" id="pfw" type="number" inputmode="decimal" min="30" max="300" step="0.1" placeholder="Gewicht kg" value="'+(p.w||(S.bw.length?S.bw[S.bw.length-1].kg:''))+'" data-in="pfw" aria-label="Gewicht in Kilogramm"></div>'+
    '<select class="sel" id="pfact" data-in="pfact" aria-label="Aktivität">'+[[1.2,'Kaum aktiv, Bürojob'],[1.375,'Leicht aktiv, 1 bis 3 Einheiten pro Woche'],[1.55,'Mäßig aktiv, 3 bis 5 Einheiten pro Woche'],[1.725,'Sehr aktiv, 6 bis 7 Einheiten pro Woche']].map(function(a){return '<option value="'+a[0]+'"'+(+p.act===a[0]?' selected':'')+'>'+a[1]+'</option>'}).join('')+'</select>'+
    '<select class="sel" id="pfg" data-in="pfg" aria-label="Ziel">'+[[-500,'Abnehmen (minus 500 kcal)'],[-250,'Langsam abnehmen (minus 250 kcal)'],[0,'Gewicht halten'],[250,'Langsam aufbauen (plus 250 kcal)'],[400,'Aufbauen (plus 400 kcal)']].map(function(a){return '<option value="'+a[0]+'"'+(+p.g===a[0]?' selected':'')+'>'+a[1]+'</option>'}).join('')+'</select><div id="pfres" class="sec" style="gap:8px">'+pfRes()+'</div></section>';
}
function bkButtons(){
  return (DL?'<button class="ghost" data-a="bkexp">Backup speichern</button>':'')+'<button class="ghost'+(ui.conf==='bkload'?' warn sure':'')+'" data-a="bkload">'+(ui.conf==='bkload'?'Ersetzt deine Daten. Nochmal tippen':'Backup laden')+'</button>';
}
async function buildBackup(){
  var months={},i,key;
  try{for(i=0;i<localStorage.length;i++){key=localStorage.key(i);if(key&&key.indexOf(FK)===0){try{months[key.slice(FK.length)]=JSON.parse(localStorage.getItem(key))}catch(e){}}}}catch(e){}
  Object.keys(F).forEach(function(m){if(!months[m]||F[m].t>=months[m].t)months[m]=F[m]});
  if(rcol){try{var s=await rcol.get();s.docs.forEach(function(d){if(d.id.indexOf('f_')===0){try{var r=JSON.parse(d.data().json),m=d.id.slice(2);if(!months[m]||r.t>months[m].t)months[m]=r}catch(e){}}})}catch(e){}}
  return JSON.stringify({satzbuch:1,exported:new Date().toISOString(),state:S,food:months},null,1);
}
function importBackup(text){
  var b=null;try{b=JSON.parse(text)}catch(e){}
  if(!b||b.satzbuch!==1||!b.state||b.state.v!==1){toast('Diese Datei ist kein Satzbuch-Backup.');return}
  S=norm(b.state);F={};fpulled={};
  try{for(var i=localStorage.length-1;i>=0;i--){var key=localStorage.key(i);if(key&&key.indexOf(FK)===0)localStorage.removeItem(key)}}catch(e){}
  Object.keys(b.food||{}).forEach(function(m){var r=b.food[m];if(r&&r.m){r.t=Date.now();F[m]=r;try{localStorage.setItem(FK+m,JSON.stringify(r))}catch(e){}queueFood(m)}});
  save();render();toast('Backup geladen.');
}

function render(){

  $('#view').innerHTML=({heute:vToday,plaene:vPlans,essen:vFood,verlauf:vProg,mehr:vMore})[ui.tab]();

}

/* ---------- Training ---------- */
function newEx(x){var ex=getEx(x),l=lastSets(x),n=l?Math.max(3,Math.min(l.length,5)):3,s=[],dr=(!l&&ex.g==='reha')?(ex.t?30:10):'';for(var i=0;i<n;i++){var r=l&&(l[i]||l[l.length-1]);s.push({kg:r?r[0]:'',reps:r?r[1]:dr,done:0,pr:0})}return {x:x,s:s}}
function startWorkout(pid,di){
  var plan=allPlans().find(function(p){return p.id===pid}),day=plan&&plan.days[di];
  S.act={n:day?day.n:'Freies Training',p:day?pid:null,di:day?di:null,t0:Date.now(),e:(day?day.ex:[]).map(newEx)};
  ui.sum=null;save();
}
function finish(){
  var a=S.act,es=a.e.map(function(e){return {x:e.x,s:e.s.filter(function(s){return s.done}).map(function(s){return [+s.kg||0,+s.reps||0,s.pr?1:0]})}}).filter(function(e){return e.s.length});
  if(!es.length){toast('Hake mindestens einen Satz ab.');return}
  var w={id:Date.now().toString(36),d:new Date(a.t0).toISOString(),n:a.n,p:a.p,di:a.di,m:Math.max(1,Math.round((Date.now()-a.t0)/60000)),e:es};
  S.w.push(w);S.w.sort(function(x,y){return x.d<y.d?-1:x.d>y.d?1:0});
  S.act=null;rest=null;
  ui.sum={sets:nsets(w),vol:vol(w),prs:es.reduce(function(n,e){return n+e.s.filter(function(s){return s[2]}).length},0)};
  if(wl){try{wl.release()}catch(e){}wl=null}
  save();render();window.scrollTo(0,0);
}
function sampleData(){
  var base={bank:70,schrag:24,schulterd:40,seitheben:10,trizeps:30,klimm:0,rudern:60,latzug:55,facepull:25,bizeps:30,kniebeuge:90,rdl:80,beinpresse:140,beinbeuger:45,wade:70},plan=PLANS[0],wk0=weekKey(Date.now()),seq=0,ws=[],bw=[];
  for(var wi=6;wi>=0;wi--){[0,2,4].forEach(function(off,di){
    if(wi===4&&di===1)return;
    var d=new Date(wk0);d.setDate(d.getDate()-wi*7+off);d.setHours(18,15,0,0);
    if(d.getTime()>Date.now())return;
    var prog=6-wi;
    ws.push({id:'s'+(seq++),d:d.toISOString(),n:plan.days[di].n,p:'ppl',di:di,m:52+((wi*7+di*3)%14),s:1,e:plan.days[di].ex.map(function(x){
      var b=base[x],inc=b>=60?2.5:1,kg=x==='klimm'?0:b+(prog-((prog+di)%4===3?1:0))*inc,iso=b<35&&x!=='klimm',r=iso?[12,11,10]:x==='klimm'?[8,7,6]:[8,8,7];
      return {x:x,s:r.map(function(n){return [kg,n,0]})};
    })});
  })}
  for(var k=6;k>=0;k--){var d2=new Date(wk0);d2.setDate(d2.getDate()-k*7+1);if(d2.getTime()>Date.now())continue;bw.push({d:dkey(d2.getTime()),kg:+(83.2-(6-k)*.35+(((k*37)%5)-2)*.08).toFixed(1),s:1})}
  return {w:ws,bw:bw};
}

    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:o.filename});return}catch(e){if(e&&e.name==='AbortError'){var d=new Error('declined');d.code='declined';throw d}}
    }
    var u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=o.filename;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);
  }};
}
